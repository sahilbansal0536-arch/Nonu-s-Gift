<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Always Yours ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-4-bg">
  <canvas id="fx-canvas"></canvas>

  <div class="music-player-container" id="music-player">
    <div class="music-icon" id="music-disc">🎵</div>
    <div class="music-meta">
      <span class="music-title" id="music-label">Final Chapter</span>
      <span class="music-page-tag">Page 6 of 6</span>
    </div>
  </div>

  <main class="page-wrapper">
    <div class="glass-card" style="max-width: 620px;">
      <div class="big-heart-symbol">❤️</div>
      
      <div id="final-lines-container"></div>

      <div class="signature-block" id="signature" style="opacity: 0; transition: opacity 1s ease;">
        Always yours,<br>Sahil ❤️
        <div class="signature-sub">Made especially for Nonu.</div>
      </div>

      <button class="btn-romantic" data-target-url="index.html" id="restart-btn" style="opacity: 0; transition: opacity 0.8s ease; margin-top: 2rem;">
        <span>Read it again? 🌸</span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCanvasFX('fireflies');
      new AutoAudioEngine(CONFIG.songs.page6);

      const container = document.getElementById('final-lines-container');
      const signature = document.getElementById('signature');
      const restartBtn = document.getElementById('restart-btn');

      CONFIG.finalThoughts.forEach((text, i) => {
        const div = document.createElement('div');
        div.className = 'reveal-line body-text';
        if (i === 0) {
          div.style.color = '#fff';
          div.style.fontWeight = '500';
          div.style.fontSize = '1.15rem';
          div.style.marginBottom = '1.2rem';
        }
        div.textContent = text;
        container.appendChild(div);
      });

      const lines = document.querySelectorAll('.reveal-line');
      lines.forEach((line, index) => {
        setTimeout(() => {
          line.classList.add('visible');
          if (index === lines.length - 1) {
            setTimeout(() => {
              signature.style.opacity = '1';
              restartBtn.style.opacity = '1';
            }, 800);
          }
        }, (index + 1) * 950);
      });
    });
  </script>
</body>
</html>
